<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Star Earn Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 450px;
        }
        .profile-card {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            padding: 24px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
            border: 1px solid #334155;
        }
        .profile-card h1 {
            margin: 10px 0 5px 0;
            color: var(--accent);
            font-size: 38px;
            font-weight: 800;
        }
        .btn {
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            color: #0f172a;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
            margin-top: 15px;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }
        .btn:active { transform: scale(0.98); }
        .btn-withdraw {
            background: linear-gradient(135deg, #22c55e 0%, #15803d 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
        }
        .section-title {
            font-size: 18px;
            margin: 20px 0 10px 0;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .ad-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .ad-item {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .ad-info h4 { margin: 0 0 5px 0; font-size: 16px; font-weight: 600; }
        .ad-info p { margin: 0; font-size: 13px; color: var(--text-secondary); }
        .ad-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: 0.2s;
            min-width: 90px;
            text-align: center;
        }
        .ad-btn:disabled {
            background: #475569;
            color: #cbd5e1;
            cursor: not-allowed;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.2s ease-in-out;
        }
        .modal-content {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            width: 85%;
            max-width: 320px;
            border: 1px solid #475569;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .timer-text { font-size: 45px; color: var(--accent); font-weight: 800; margin: 15px 0; }
        
        .modal-btn {
            background: var(--accent);
            color: #0f172a;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            margin-top: 15px;
            cursor: pointer;
            width: 100%;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- User Profile & Balance -->
        <div class="profile-card">
            <p id="username-display" style="color: var(--text-secondary); margin: 0; font-size: 14px;">Loading user...</p>
            <h1>⭐ <span id="points-display">0</span></h1>
            <p style="margin: 0; font-size: 14px; color: var(--text-secondary);">Telegram Stars Balance</p>
            <button class="btn btn-withdraw" onclick="requestWithdraw()">Withdraw Stars</button>
        </div>

        <!-- Ad List Section -->
        <div class="section-title">
            <span>Available Ads</span>
            <span style="font-size: 12px; color: var(--accent);">1 Star per Ad</span>
        </div>
        <div class="ad-list" id="ad-container">
            <p style="text-align: center; color: var(--text-secondary);">Loading ads...</p>
        </div>
    </div>

    <!-- 10 Seconds Wait Modal -->
    <div class="modal" id="timerModal">
        <div class="modal-content">
            <h3 style="margin-top:0;">Watching Ad...</h3>
            <p style="font-size: 13px; color: var(--text-secondary);">Please stay on the ad page to claim your reward safely.</p>
            <div class="timer-text" id="countdown">10</div>
        </div>
    </div>

    <!-- Generic Popup Modal (For Withdraw & Limits) -->
    <div class="modal" id="infoModal">
        <div class="modal-content">
            <h3 id="modalTitle" style="margin-top:0; color: var(--accent);">Notice</h3>
            <p id="modalDesc" style="font-size: 14px; color: var(--text-secondary); line-height: 1.5;"></p>
            <button class="modal-btn" onclick="closeInfoModal()">Got It</button>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzznLiLFUXeG9KHf1GAWAg9VnN1SfGOh7jWUAHEVD_uA_4N7oF02p3qB3vjh9Kr6y4s/exec"; // ඔයාගේ Web App URL එක

        let tg = window.Telegram.WebApp;
        tg.expand();

        let user = tg.initDataUnsafe.user;
        let telegramId = user ? user.id : "9999999"; 
        let username = user ? user.username : "guest_user";

        document.getElementById("username-display").innerText = "@" + username;

        let activeAdUrl = "";
        let activeAdId = "";
        let adsDataList = [];

        function loadAppData() {
            fetch(`${API_URL}?action=getData&id=${telegramId}&username=${username}`)
                .then(res => res.json())
                .then(data => {
                    if(data.status === "success") {
                        document.getElementById("points-display").innerText = data.points;
                        adsDataList = data.ads;
                        renderAds();
                    }
                });
        }

        function renderAds() {
            let container = document.getElementById("ad-container");
            container.innerHTML = "";
            
            if(adsDataList.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: var(--text-secondary);">No ads available right now!</p>`;
                return;
            }

            adsDataList.forEach(ad => {
                let html = `
                    <div class="ad-item">
                        <div class="ad-info">
                            <h4>${ad.title}</h4>
                            <p>Reward: ${ad.points} Star</p>
                        </div>
                        <button class="ad-btn" id="btn_${ad.id}" onclick="startAdFlow('${ad.id}', '${ad.url}')">View Ad</button>
                    </div>
                `;
                container.innerHTML += html;
            });

            // Check timers for all ads
            updateAllTimers();
            setInterval(updateAllTimers, 1000);
        }

        // 30 Minutes Cooldown Handler & Live Countdown Loop
        function updateAllTimers() {
            adsDataList.forEach(ad => {
                let btn = document.getElementById(`btn_${ad.id}`);
                if (!btn) return;

                let lastClickTime = parseInt(localStorage.getItem(`cooldown_${ad.id}`) || 0);
                let now = new Date().getTime();
                let cooldownDuration = 30 * 60 * 1000; // 30 Minutes in milliseconds
                let elapsed = now - lastClickTime;

                if (elapsed < cooldownDuration) {
                    let timeLeftSec = Math.ceil((cooldownDuration - elapsed) / 1000);
                    let mins = Math.floor(timeLeftSec / 60);
                    let secs = timeLeftSec % 60;
                    
                    btn.innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                    btn.disabled = true;
                } else {
                    btn.innerText = "View Ad";
                    btn.disabled = false;
                }
            });
        }

        function startAdFlow(adId, adUrl) {
            activeAdId = adId;
            activeAdUrl = adUrl;

            window.open(activeAdUrl, '_blank');

            let modal = document.getElementById("timerModal");
            modal.style.display = "flex";
            let timeLeft = 10;
            document.getElementById("countdown").innerText = timeLeft;

            let countdownInterval = setInterval(() => {
                timeLeft--;
                document.getElementById("countdown").innerText = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(countdownInterval);
                    modal.style.display = "none";
                    
                    // Set 30 mins cooldown timestamp in LocalStorage
                    localStorage.setItem(`cooldown_${activeAdId}`, new Date().getTime());
                    updateAllTimers();

                    claimReward(activeAdId);
                }
            }, 1000);
        }

        function claimReward(adId) {
            fetch(`${API_URL}?action=clickAd&id=${telegramId}&adId=${adId}`)
                .then(res => res.json())
                .then(data => {
                    if(data.status === "success") {
                        document.getElementById("points-display").innerText = data.points;
                        showInfoModal("Success!", "🎉 1 Telegram Star added successfully to your account balance!");
                        loadAppData();
                    } else {
                        showInfoModal("Error", data.message);
                    }
                });
        }

        // Withdraw Request Function with Advanced Popups & Username Details
        function requestWithdraw() {
            let currentPoints = parseInt(document.getElementById("points-display").innerText);
            
            if (currentPoints < 1000) {
                showInfoModal("Limit Required", "❌ You need a minimum of **1000 Stars** in your balance to request a withdrawal. Keep watching ads to reach the goal!");
                return;
            }

            // If points >= 1000, process withdraw request
            fetch(`${API_URL}?action=withdraw&id=${telegramId}`)
                .then(res => res.json())
                .then(data => {
                    if(data.status === "success") {
                        document.getElementById("points-display").innerText = data.points;
                        showInfoModal("Withdrawal Pending", `✅ **Request Submitted Successfully!**<br><br>Account: @${username}<br>Status: <b>Pending</b><br>Your stars will be transferred within **1-3 working days** after verification.`);
                    } else {
                        showInfoModal("Notice", data.message);
                    }
                });
        }

        function showInfoModal(title, desc) {
            document.getElementById("modalTitle").innerHTML = title;
            document.getElementById("modalDesc").innerHTML = desc;
            document.getElementById("infoModal").style.display = "flex";
        }

        function closeInfoModal() {
            document.getElementById("infoModal").style.display = "none";
        }

        // Initial Load
        loadAppData();
    </script>
</body>
</html>
